name: API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start API
        run: |
          nohup uvicorn app:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &

      - name: Wait for API
        run: |
          python -c "import time, requests; time.sleep(2); requests.get('http://127.0.0.1:8000/docs')"

      - name: Run tests
        run: |
          pytest -v